name: CloudOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t cloudops-api:${{ github.sha }} .

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: rajkumarcloudopsacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag cloudops-api:${{ github.sha }} rajkumarcloudopsacr.azurecr.io/cloudops-api:${{ github.sha }}
          docker tag cloudops-api:${{ github.sha }} rajkumarcloudopsacr.azurecr.io/cloudops-api:latest

      - name: Push Docker image to ACR
        if: github.event_name == 'push'
        run: |
          docker push rajkumarcloudopsacr.azurecr.io/cloudops-api:${{ github.sha }}
          docker push rajkumarcloudopsacr.azurecr.io/cloudops-api:latest